include theme.conf

# Terminal type
term xterm-256color

# Default shell
shell /run/current-system/sw/bin/zsh

# Window settings
window_padding_width 0
dynamic_title yes
initial_window_width  130c
initial_window_height 44c
hide_window_decorations yes
confirm_os_window_close 0
font_size 23.0

# Scrolling
scrollback_lines 5000

# Keybindings
map ctrl+p paste_from_clipboard

# BEGIN_KITTY_FONTS
font_family      family='FuraMono Nerd Font' style=Medium
bold_font        auto
italic_font      family='FuraMono Nerd Font' style=Medium
bold_italic_font auto
# END_KITTY_FONTS
